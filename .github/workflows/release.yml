# Push a tag like v0.1.0 to build, test and publish a GitHub Release, update the Scoop manifest
# (bucket/xlgrep.json) and publish to crates.io and PyPI.
# Run it by hand (Actions > release > Run workflow) to build and test without publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # musl: fully static, runs on any Linux distro
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo pkgid | sed 's/.*[#@]//')"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --release --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "xlgrep-${{ github.ref_name }}-${{ matrix.target }}"
          Compress-Archive -Path target/${{ matrix.target }}/release/xlgrep.exe, README.md, LICENSE-MIT, LICENSE-APACHE -DestinationPath "$name.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="xlgrep-${{ github.ref_name }}-${{ matrix.target }}"
          tar czf "$name.tar.gz" -C target/${{ matrix.target }}/release xlgrep -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: xlgrep-*

  # PyPI wheels with the same binary inside, for `uvx xlgrep` and `pipx install xlgrep`
  wheels:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
          - { os: macos-latest, target: universal2-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: astral-sh/setup-uv@v7
      - name: Smoke test the wheel
        shell: bash
        run: |
          uvx --from dist/*.whl xlgrep --version
          uvx --from dist/*.whl xlgrep jane -i tests/data/contacts.xlsx
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
      - run: sha256sum xlgrep-* > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" xlgrep-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v7
        with:
          ref: main
          path: repo
      - name: Update Scoop manifest
        run: |
          zip="xlgrep-$GITHUB_REF_NAME-x86_64-pc-windows-msvc.zip"
          jq -n --arg v "${GITHUB_REF_NAME#v}" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$zip" \
            --arg hash "$(sha256sum "$zip" | cut -d' ' -f1)" \
            '{version: $v, description: "grep for spreadsheets: search cell values and formulas across .xlsx/.xlsm/.xlsb/.xls/.ods files",
              homepage: "https://github.com/DavisMcCracken/xlgrep", license: "MIT|Apache-2.0",
              url: $url, hash: $hash, bin: "xlgrep.exe"}' > repo/bucket/xlgrep.json
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "scoop: xlgrep ${GITHUB_REF_NAME#v}"
          git push

  crates-io:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing: no stored token
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing: no stored token
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
