# Push a tag like v0.1.0 to build, test and publish a GitHub Release.
# Run it by hand (Actions > release > Run workflow) to build and test without publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # musl: fully static, runs on any Linux distro
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --release --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "xlgrep-${{ github.ref_name }}-${{ matrix.target }}"
          Compress-Archive -Path target/${{ matrix.target }}/release/xlgrep.exe, README.md, LICENSE-MIT, LICENSE-APACHE -DestinationPath "$name.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="xlgrep-${{ github.ref_name }}-${{ matrix.target }}"
          tar czf "$name.tar.gz" -C target/${{ matrix.target }}/release xlgrep -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: xlgrep-*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum xlgrep-* > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" xlgrep-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
