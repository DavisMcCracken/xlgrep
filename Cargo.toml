[package]
name = "xlgrep"
version = "0.1.0"
edition = "2024"
description = "grep for spreadsheets: search cell values and formulas across .xlsx/.xlsm/.xlsb/.xls/.ods files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DavisMcCracken/xlgrep"
keywords = ["excel", "spreadsheet", "grep", "xlsx", "search"]
categories = ["command-line-utilities"]
include = ["src/", "README.md", "LICENSE-*"]

[dependencies]
calamine = { version = "0.36.1", features = ["dates"] }
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
regex-syntax = "0.8.11"
terminal_size = "0.4.4"

[profile.release]
# a single downloadable binary: smaller beats faster builds
lto = true
codegen-units = 1
strip = true
