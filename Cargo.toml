[package]
name = "xlgrep"
version = "0.4.0"
edition = "2024"
description = "grep for spreadsheets: search cell values and formulas across .xlsx/.xlsm/.xlsb/.xls/.ods files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DavisMcCracken/xlgrep"
keywords = ["excel", "spreadsheet", "grep", "xlsx", "search"]
categories = ["command-line-utilities"]
include = ["src/", "README.md", "LICENSE-*"]

[dependencies]
anstyle-query = "1.1.5"
calamine = { version = "0.36.1", features = ["dates"] }
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
regex-syntax = "0.8.11"
terminal_size = "0.4.4"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
# a single downloadable binary: smaller beats faster builds
lto = true
codegen-units = 1
strip = true
# no `panic = "abort"`: workers catch calamine panics so one bad file can't take down the search
