[package]
name = "xlgrep"
version = "0.1.0"
edition = "2024"
description = "Search spreadsheet cell values (.xlsx/.xlsm/.xlsb/.xls/.ods) across folders"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DavisMcCracken/xlgrep"

[dependencies]
calamine = { version = "0.36.1", features = ["dates"] }
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
parking_lot = "0.12.5"
regex = "1.13.1"
regex-syntax = "0.8.11"
terminal_size = "0.4.4"

[profile.release]
# a single downloadable binary: smaller beats faster builds
lto = true
codegen-units = 1
strip = true
